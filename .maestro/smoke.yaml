# T-050-01 — the development build installs, loads its JavaScript from Metro, and
# renders the application shell. Run by tools/ci/smoke.sh on both platforms,
# which opens the development build on the Metro server before this flow starts.
appId: ${APP_ID}
name: Development build smoke test
---
# iOS asks before handing a custom-scheme link to the app, and the prompt can
# appear some seconds after the link is opened: keep answering it until the
# shell renders. A first load that fails transiently (the development client's
# error screen, or React Native's) is retried with its Reload button.
- repeat:
    while:
      notVisible:
        id: "iriguchi-root"
    times: 60
    commands:
      # An emulator's own apps sometimes stop responding while it settles, and
      # their "isn't responding" dialog covers Iriguchi; let them wait.
      - tapOn:
          text: "Wait"
          optional: true
      - tapOn:
          text: "Open"
          optional: true
      - tapOn:
          text: "Reload"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "iriguchi-root"
          timeout: 10000
          optional: true
- assertVisible:
    id: "iriguchi-root"
# T-050-10: each screen carries its screenId, and marks itself settled.
# T-050-02: an operator redeems the enrolment code their organiser issued, and with
# a grant reaches the scan screen of the gate they choose. kippu-api is the
# stand-in tools/ci/smoke.sh starts.
# A second attempt of the flow finds the session the first one kept, and starts
# at the gates.
- extendedWaitUntil:
    visible:
      id: "(operator\\.signin|gate\\.choose)\\.settled"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "operator.signin"
    commands:
      - tapOn:
          id: "signin-code"
      - inputText: "GATE-ENROL-TEST"
      - hideKeyboard:
          optional: true
      - tapOn:
          id: "signin-submit"
- extendedWaitUntil:
    visible:
      id: "gate.choose.settled"
    timeout: 30000
- assertVisible:
    id: "gate-choice"
    text: ".*North.*"
- tapOn:
    id: "gate-choice"
- extendedWaitUntil:
    visible:
      id: "gate.scan.settled"
    timeout: 30000
- assertVisible:
    id: "scan-gate"
    text: "North"
- assertVisible: "Smoke Test Night"
# T-050-07: the stand-in's clock runs 30 s behind the device's. Opening the gate
# compares the clocks, and the operator is warned.
- extendedWaitUntil:
    visible:
      id: "clock-drift-warning"
    timeout: 30000
# T-050-07: in airplane mode the gate blocks: no scanning, no admission (REQ-CL-3).
# Maestro sets airplane mode on Android only; the iOS simulator shares the host's
# network and cannot be taken offline.
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
      - extendedWaitUntil:
          visible:
            id: "gate-offline"
          timeout: 30000
      - assertNotVisible:
          id: "scan-fixture"
      - setAirplaneMode: disabled
      - extendedWaitUntil:
          notVisible:
            id: "gate-offline"
          timeout: 60000
# T-050-03: a Saifu pass's QR code (test/fixtures/saifu-pass.png), read by the
# platform's own QR decoder — Core Image on iOS, ML Kit on Android — decodes to
# the pass it carries. Simulators have no camera, so the scan fixture stands in
# for it (src/scan/fixture.ts); the reading path after the decoder is the camera's.
- scrollUntilVisible:
    element:
      id: "scan-fixture"
    direction: DOWN
- tapOn:
    id: "scan-fixture"
# T-050-04: the pass then gets its verdict. The smoke flow runs no ledger service,
# so the verdict is "no verdict — do not admit" (REQ-CL-3); the verdicts themselves
# are tested end to end in src/verdict/verdict.test.ts and in kippu-e2e.
- scrollUntilVisible:
    element:
      id: "verdict-unavailable"
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "pass-ticket"
    direction: DOWN
- assertVisible:
    id: "pass-ticket"
    text: "7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e7e"
# The scan screen scrolls: a small screen shows the rest of the pass below.
- scrollUntilVisible:
    element:
      id: "pass-holder"
    direction: DOWN
- assertVisible:
    id: "pass-holder"
    text: "03867551a0096eb0f865cb69e83ef876d6c4947677048aebab2ec5d856cd1c29"
- scrollUntilVisible:
    element:
      id: "scan-next"
    direction: DOWN
- tapOn:
    id: "scan-next"
- scrollUntilVisible:
    element:
      id: "scan-fixture"
    direction: DOWN
